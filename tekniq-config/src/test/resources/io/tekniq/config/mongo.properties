mongo.uri=mongodb://user:pass@host:27017
mongo.database=orders
mongo.pool.min=2
mongo.pool.max=20
mongo.pool.acquireTimeoutMs=45000
mongo.retry.attempts=5
mongo.retry.backoffMs=250
mongo.ssl.enabled=true
mongo.ssl.trustStorePath=/etc/ssl/mongo.jks
mongo.options.timeout=5000
mongo.options.appName=order-service
mongo.tags=primary,replica
